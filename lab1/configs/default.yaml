# Base configuration of the RAG pipeline.
# Every experiment in configs/experiments.yaml overrides only part of these keys.

paths:
  data_dir: data
  raw_dir: data/raw
  processed_dir: data/processed
  index_dir: data/index
  eval_file: data/eval/questions.jsonl
  results_dir: experiments/results

grabber:
  user_agent: "PAD-Lab1-RAG-Grabber/1.0 (student project, UTM FCIM)"
  timeout_s: 30
  max_retries: 4
  delay_s: 0.3            # pause between requests to be polite to the server
  per_page: 100
  sites:
    - name: utm
      base_url: https://utm.md
      content_types:
        pages: {max_items: null}       # null = everything
        posts: {max_items: 300}        # only the most recently modified news items
    - name: fcim
      base_url: https://fcim.utm.md
      content_types:
        pages: {max_items: null}
        posts: {max_items: 300}
  pdf:
    enabled: true
    max_files_per_site: 60
    max_size_mb: 25       # ghidul-studentului.pdf is 19 MB
    # Only normative documents: schedules (orar) and CVs are tables/personal data and add noise
    include_keywords: [regulament, ghid, metodologie, cod-, codul, statut, carta, procedura, instructiune, guide, regulation, plan-de-invatamant, curriculum]
    exclude_keywords: [orar, cv, vitae, europass, ordin, proces-verbal, lista, rezultat, anunt, raport-autoevaluare]

preprocessing:
  min_doc_chars: 300
  drop_selectors: [script, style, nav, footer, form, iframe, noscript, figure, ".sharedaddy", ".wp-block-buttons"]

chunking:
  strategy: heading       # fixed | overlap | paragraph | heading
  chunk_size: 800         # characters
  chunk_overlap: 150
  min_chunk_chars: 120

embeddings:
  model: intfloat/multilingual-e5-small
  batch_size: 32
  device: auto            # cuda if a GPU build of torch sees a GPU, else cpu (also used by the reranker)

vector_store:
  backend: chroma
  distance: cosine

retrieval:
  top_k: 20               # candidates passed on to the filters/reranker

filters:
  score_threshold: 0.75   # cosine similarity; cheap pre-filter only (e5 scores are compressed into 0.75-0.95)
  dedup_threshold: 0.8    # word-3-gram Jaccard; same news posted on utm.md and fcim.utm.md
  min_chunk_chars: 120
  max_per_document: 2
  languages: null         # e.g. [ro] to restrict to one language

reranker:
  enabled: true
  model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
  top_n: 5
  min_score: 0.0          # cross-encoder logit; separates "no answer in the base" much better than cosine

generation:
  backend: ollama
  host: http://localhost:11434
  model: qwen2.5:3b
  temperature: 0.1
  num_ctx: 4096
  prompt: strict          # strict | basic  (see src/generation/prompts.py)
  max_context_chars: 6000

evaluation:
  k_values: [1, 3, 5, 10, 20]
  judge:
    enabled: false        # LLM-as-a-Judge is slow on CPU: enabled only for the final comparison
    model: qwen2.5:7b
