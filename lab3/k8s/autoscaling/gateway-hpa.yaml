# Automatic horizontal scaling of the gateway by CPU (needs the metrics-server addon:
#   minikube addons enable metrics-server). Manual scaling is shown with kubectl scale on order-service.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: libraria
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
