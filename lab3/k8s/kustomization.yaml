# kubectl apply -k lab3/k8s   — everything except the Secret, which is created from lab3/.env (see scripts/deploy.ps1)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
