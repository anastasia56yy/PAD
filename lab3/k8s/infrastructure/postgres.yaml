# PostgreSQL: one server, a separate database and login per service (database-per-service).
# StatefulSet + PersistentVolumeClaim: data survives pod restarts and rescheduling.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: libraria
data:
  init-databases.sh: |
    #!/bin/sh
    # runs once, on the first start of an empty volume
    set -e
    create_db() {
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-SQL
        CREATE USER $2 WITH PASSWORD '$3';
        CREATE DATABASE $1 OWNER $2;
        REVOKE ALL ON DATABASE $1 FROM PUBLIC;
    SQL
    }
    create_db auth_db         auth_svc         "$AUTH_DB_PASSWORD"
    create_db user_db         user_svc         "$USER_DB_PASSWORD"
    create_db catalog_db      catalog_svc      "$CATALOG_DB_PASSWORD"
    create_db inventory_db    inventory_svc    "$INVENTORY_DB_PASSWORD"
    create_db cart_db         cart_svc         "$CART_DB_PASSWORD"
    create_db order_db        order_svc        "$ORDER_DB_PASSWORD"
    create_db payment_db      payment_svc      "$PAYMENT_DB_PASSWORD"
    create_db notification_db notification_svc "$NOTIFICATION_DB_PASSWORD"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: libraria
  labels: {app: postgres}
spec:
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: libraria
  labels: {app: postgres, app.kubernetes.io/part-of: libraria}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432, name: postgres}]
          env:
            - {name: POSTGRES_USER, value: postgres}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: shop-secrets, key: POSTGRES_PASSWORD}}}
            - {name: AUTH_DB_PASSWORD, valueFrom: {secretKeyRef: {name: shop-secrets, key: AUTH_DB_PASSWORD}}}
            - {name: USER_DB_PASSWORD, valueFrom: {secretKeyRef: {name: shop-secrets, key: USER_DB_PASSWORD}}}
            - {name: CATALOG_DB_PASSWORD, valueFrom: {secretKeyRef: {name: shop-secrets, key: CATALOG_DB_PASSWORD}}}
            - {name: INVENTORY_DB_PASSWORD, valueFrom: {secretKeyRef: {name: shop-secrets, key: INVENTORY_DB_PASSWORD}}}
            - {name: CART_DB_PASSWORD, valueFrom: {secretKeyRef: {name: shop-secrets, key: CART_DB_PASSWORD}}}
            - {name: ORDER_DB_PASSWORD, valueFrom: {secretKeyRef: {name: shop-secrets, key: ORDER_DB_PASSWORD}}}
            - {name: PAYMENT_DB_PASSWORD, valueFrom: {secretKeyRef: {name: shop-secrets, key: PAYMENT_DB_PASSWORD}}}
            - {name: NOTIFICATION_DB_PASSWORD, valueFrom: {secretKeyRef: {name: shop-secrets, key: NOTIFICATION_DB_PASSWORD}}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "postgres"]}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "1", memory: "768Mi"}
      volumes:
        - name: init
          configMap: {name: postgres-init, defaultMode: 0555}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 2Gi}
