# Whole system with one command:  docker compose --env-file .env up --build
# Secrets come from .env (copy .env.example, never commit .env).

x-service-env: &service-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  JWT_SECRET: ${JWT_SECRET}

x-healthcheck: &healthcheck
  # slim images have no curl: use Python itself
  test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

x-light: &light
  build:
    context: ..
    dockerfile: lab2/docker/Dockerfile.service
  restart: unless-stopped
  healthcheck: *healthcheck

x-rag: &rag
  build:
    context: ..
    dockerfile: lab2/docker/Dockerfile.rag
  restart: unless-stopped
  healthcheck:
    <<: *healthcheck
    start_period: 90s
  extra_hosts:
    - "host.docker.internal:host-gateway"   # Ollama runs on the host (uses the GPU there)

services:
  # ---------------- infrastructure ----------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      HISTORY_DB_PASSWORD: ${HISTORY_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"   # management UI: watch queues and events during the demo
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  # ---------------- business services ----------------
  auth-service:
    <<: *light
    build: {context: .., dockerfile: lab2/docker/Dockerfile.service, args: {SERVICE_DIR: lab2/services/auth-service}}
    environment:
      <<: *service-env
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql+psycopg://auth_svc:${AUTH_DB_PASSWORD}@postgres:5432/auth_db
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      JWT_TTL_SECONDS: "3600"
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}

  user-service:
    <<: *light
    build: {context: .., dockerfile: lab2/docker/Dockerfile.service, args: {SERVICE_DIR: lab2/services/user-service}}
    environment:
      <<: *service-env
      SERVICE_NAME: user-service
      DATABASE_URL: postgresql+psycopg://user_svc:${USER_DB_PASSWORD}@postgres:5432/user_db
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}

  history-service:
    <<: *light
    build: {context: .., dockerfile: lab2/docker/Dockerfile.service, args: {SERVICE_DIR: lab2/services/history-service}}
    environment:
      <<: *service-env
      SERVICE_NAME: history-service
      DATABASE_URL: postgresql+psycopg://history_svc:${HISTORY_DB_PASSWORD}@postgres:5432/history_db
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}

  notification-service:
    <<: *light
    build: {context: .., dockerfile: lab2/docker/Dockerfile.service, args: {SERVICE_DIR: lab2/services/notification-service}}
    environment:
      <<: *service-env
      SERVICE_NAME: notification-service
      DATABASE_URL: postgresql+psycopg://notification_svc:${NOTIFICATION_DB_PASSWORD}@postgres:5432/notification_db
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}

  search-service:
    <<: *rag
    build: {context: .., dockerfile: lab2/docker/Dockerfile.rag, args: {SERVICE_DIR: lab2/services/search-service}}
    environment:
      <<: *service-env
      SERVICE_NAME: search-service
      RAG_DATA_DIR: /data
      INGESTION_URL: http://ingestion-service:8000
    volumes:
      - ./data/search:/data          # owns the vector index
      - model-cache:/models
    depends_on: {rabbitmq: {condition: service_healthy}}

  answer-service:
    <<: *rag
    build: {context: .., dockerfile: lab2/docker/Dockerfile.rag, args: {SERVICE_DIR: lab2/services/answer-service}}
    environment:
      <<: *service-env
      SERVICE_NAME: answer-service
      SEARCH_URL: http://search-service:8000
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on: {rabbitmq: {condition: service_healthy}, search-service: {condition: service_started}}

  ingestion-service:
    <<: *rag
    build: {context: .., dockerfile: lab2/docker/Dockerfile.rag, args: {SERVICE_DIR: lab2/services/ingestion-service}}
    environment:
      <<: *service-env
      SERVICE_NAME: ingestion-service
      RAG_DATA_DIR: /data
    volumes:
      - ./data/ingestion:/data       # owns the grabber manifest and documents
      - model-cache:/models
    depends_on: {rabbitmq: {condition: service_healthy}}

  # ---------------- entry point ----------------
  gateway:
    <<: *light
    build: {context: .., dockerfile: lab2/docker/Dockerfile.service, args: {SERVICE_DIR: lab2/gateway}}
    environment:
      <<: *service-env
      SERVICE_NAME: api-gateway
    ports:
      - "8080:8000"
    depends_on:
      auth-service: {condition: service_healthy}
      user-service: {condition: service_healthy}
      history-service: {condition: service_healthy}
      notification-service: {condition: service_healthy}
      answer-service: {condition: service_started}

volumes:
  postgres-data:
  model-cache:
