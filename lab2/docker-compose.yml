# Libraria bookstore: the whole system with one command
#   docker compose --env-file .env up -d --build
# Secrets come from .env (copy .env.example, never commit .env).

x-service: &service
  build:
    context: ..
    dockerfile: lab2/docker/Dockerfile.service
  restart: unless-stopped
  healthcheck:
    # slim images have no curl: use Python itself
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s
  depends_on:
    postgres: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}

x-env: &env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  JWT_SECRET: ${JWT_SECRET}

services:
  # ---------------- infrastructure ----------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      CART_DB_PASSWORD: ${CART_DB_PASSWORD}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"   # management UI: watch the queues of the checkout saga during the demo
    healthcheck:
      # "ping" only says the node is up; check that AMQP connections are really accepted
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  # ---------------- business services ----------------
  auth-service:
    <<: *service
    build: {context: .., dockerfile: lab2/docker/Dockerfile.service, args: {SERVICE_DIR: lab2/services/auth-service}}
    environment:
      <<: *env
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql+psycopg://auth_svc:${AUTH_DB_PASSWORD}@postgres:5432/auth_db
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      JWT_TTL_SECONDS: "3600"

  user-service:
    <<: *service
    build: {context: .., dockerfile: lab2/docker/Dockerfile.service, args: {SERVICE_DIR: lab2/services/user-service}}
    environment:
      <<: *env
      SERVICE_NAME: user-service
      DATABASE_URL: postgresql+psycopg://user_svc:${USER_DB_PASSWORD}@postgres:5432/user_db

  catalog-service:
    <<: *service
    build: {context: .., dockerfile: lab2/docker/Dockerfile.service, args: {SERVICE_DIR: lab2/services/catalog-service}}
    environment:
      <<: *env
      SERVICE_NAME: catalog-service
      DATABASE_URL: postgresql+psycopg://catalog_svc:${CATALOG_DB_PASSWORD}@postgres:5432/catalog_db
      SEED_CATALOG: "true"

  inventory-service:
    <<: *service
    build: {context: .., dockerfile: lab2/docker/Dockerfile.service, args: {SERVICE_DIR: lab2/services/inventory-service}}
    environment:
      <<: *env
      SERVICE_NAME: inventory-service
      DATABASE_URL: postgresql+psycopg://inventory_svc:${INVENTORY_DB_PASSWORD}@postgres:5432/inventory_db

  cart-service:
    <<: *service
    build: {context: .., dockerfile: lab2/docker/Dockerfile.service, args: {SERVICE_DIR: lab2/services/cart-service}}
    environment:
      <<: *env
      SERVICE_NAME: cart-service
      DATABASE_URL: postgresql+psycopg://cart_svc:${CART_DB_PASSWORD}@postgres:5432/cart_db
      CATALOG_URL: http://catalog-service:8000

  order-service:
    <<: *service
    build: {context: .., dockerfile: lab2/docker/Dockerfile.service, args: {SERVICE_DIR: lab2/services/order-service}}
    environment:
      <<: *env
      SERVICE_NAME: order-service
      DATABASE_URL: postgresql+psycopg://order_svc:${ORDER_DB_PASSWORD}@postgres:5432/order_db
      CART_URL: http://cart-service:8000

  payment-service:
    <<: *service
    build: {context: .., dockerfile: lab2/docker/Dockerfile.service, args: {SERVICE_DIR: lab2/services/payment-service}}
    environment:
      <<: *env
      SERVICE_NAME: payment-service
      DATABASE_URL: postgresql+psycopg://payment_svc:${PAYMENT_DB_PASSWORD}@postgres:5432/payment_db
      PAYMENT_PROVIDER_DELAY_SECONDS: "1.0"

  notification-service:
    <<: *service
    build: {context: .., dockerfile: lab2/docker/Dockerfile.service, args: {SERVICE_DIR: lab2/services/notification-service}}
    environment:
      <<: *env
      SERVICE_NAME: notification-service
      DATABASE_URL: postgresql+psycopg://notification_svc:${NOTIFICATION_DB_PASSWORD}@postgres:5432/notification_db

  # ---------------- entry point ----------------
  gateway:
    <<: *service
    build: {context: .., dockerfile: lab2/docker/Dockerfile.service, args: {SERVICE_DIR: lab2/gateway}}
    environment:
      <<: *env
      SERVICE_NAME: api-gateway
    ports:
      - "8080:8000"   # the only public HTTP port
    depends_on:
      auth-service: {condition: service_healthy}
      user-service: {condition: service_healthy}
      catalog-service: {condition: service_healthy}
      inventory-service: {condition: service_healthy}
      cart-service: {condition: service_healthy}
      order-service: {condition: service_healthy}
      payment-service: {condition: service_healthy}
      notification-service: {condition: service_healthy}

volumes:
  postgres-data:
